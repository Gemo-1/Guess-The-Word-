<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Guess The Word</title>
</head>
<body>
    <h1></h1>
          <div class="lives">
       <i class="fa-solid fa-heart "></i>
       <i class="fa-solid fa-heart "></i>
       <i class="fa-solid fa-heart "></i>
       <i class="fa-solid fa-heart "></i>
       <i class="fa-regular fa-heart on"></i>
       <i class="fa-regular fa-heart on"></i>
       <i class="fa-regular fa-heart on"></i>
       <i class="fa-regular fa-heart on"></i>
      </div>
    <div class="guess-game">
        <div class="game-area">
            <div class="inputs"></div>
            <div class="control">
            <button class="check">Check Word</button>
            <button class="hint">Hint <span></span></button>
            </div>
        </div>
        <div class="said">
        <div class="keys-colors">
          <h3>Key Colors</h3>
          <div class="key-color">
            <div class="key right"></div>
          <div class="key-text">Letter Is Right And In Place</div>
        </div>
          <div class="key-color">
            <div class="key not-right"></div>
          <div class="key-text">Letter Is Right But Not In Place</div>
        </div>
          <div class="key-color">
            <div class="key wrong"></div>
          <div class="key-text">Letter Is Wrong And Not Exists In Word</div>
        </div>
        </div>
       <div class="massg"></div>

    </div> 
  </div>
    <footer class="xxd"></footer>

    <script src="main.js"></script>
</body>
</html>
